name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pyflakes
        run: python -m pip install --upgrade pip pyflakes

      # pyflakes only (no flake8/pylint): flags real issues (unused imports,
      # undefined names, unused local variables) with essentially no false
      # positives, unlike a style linter -- so a failure here is always worth
      # looking at, never a formatting-opinion argument.
      - name: pyflakes
        run: python -m pyflakes app.py generate_signal.py verify_spectrum.py analyze_recording.py ccsds_chain tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -v

      - name: Check CLI scripts and package still import
        run: |
          python -c "import ccsds_chain.pipeline, ccsds_chain.reed_solomon, ccsds_chain.convolutional"
          python -c "import ast; ast.parse(open('app.py').read())"
          python generate_signal.py --n-cadu 2 -o /tmp/ci_smoke.iq
          python verify_spectrum.py /tmp/ci_smoke.iq

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hktm-simulator"
version = "0.1.0"
description = "CCSDS baseline QPSK/BPSK test-signal generator (RS + convolutional + RRC), for RF-Catcher (TestTree) Capture & Playback"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["ccsds_chain"]

[tool.setuptools.package-data]
# presets.py loads this at runtime relative to itself; without listing it
# here a non-editable install (`pip install .`, as opposed to the `-e .`
# this project's own tests/CI use) would silently ship the package without
# it.
ccsds_chain = ["presets.json"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
